name: CI - Build and Push Docker Image

on:
  push:
    branches: [ Jenifer, main ]
  pull_request:
    branches: [ Jenifer ]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout codigo
      uses: actions/checkout@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ghcr.io/jenn220/jenifer-alvarez:latest
          ghcr.io/jenn220/jenifer-alvarez:${{ github.sha }}

    - name: Mostrar variables basicas
      run: |
        echo "Probando conexion SSH con:"
        echo "Host configurado: SI"
        echo "Usuario configurado: SI"
        echo "Puerto configurado: SI"
    
    - name: Probar conexion SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        script: |
          echo "Conexion exitosa desde GitHub Actions"
          hostname
          whoami
          uptime

    - name: Copiar stack.yml al servidor
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        source: "stack.yml"
        target: "/home/${{ secrets.VPS_USER }}/deploy"

    - name: Despliegue de servicios
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        script: |
          echo "Desplegando servicios"
          cd ~/deploy
          
          echo "Descargando la imagen desde GitHub Container Registry"
          echo "${{ secrets.GHCR_PATH }}" | docker login ghcr.io -u jenn220 --password-stdin
          docker pull ghcr.io/jenn220/jenifer-alvarez:latest
          
          echo "Desplegando con Docker Stack"
          docker stack deploy --with-registry-auth -c stack.yml jenifer-alvarez
          
          echo "Verificando servicios"
          docker service ls
          
          echo "Despliegue completado"